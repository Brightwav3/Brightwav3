name: Generate contribution snake

on:
  schedule:
    # Regenerate once per day.
    - cron: "0 0 * * *"
  # Lets the profile owner regenerate the images on demand.
  workflow_dispatch:

  # Publish an updated snake immediately after workflow changes.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7ee787
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7ee787

      - name: Publish snakes to output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
